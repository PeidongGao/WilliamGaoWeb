- date: "2026-07-31"
  summary: "This week remained highly volatile. VOO and QQQ recovered modestly, while SMH declined sharply as semiconductor weakness and macro uncertainty continued."
  key_observation: "Although the broader market recovered by the end of the week, elevated long-term yields and continued semiconductor weakness suggest that the recovery remains fragile. The sharp appreciation of the yen also adds another source of macro risk."
  market_notes:
    - "The Fed kept rates unchanged at 3.50%–3.75%, but the meeting was hawkish. Three officials supported a 25-basis-point hike, while long-term Treasury yields remained elevated."
    - "AI, memory-chip, and semiconductor stocks declined sharply, especially in South Korea, amid valuation concerns, uncertainty around AI infrastructure spending, and stronger competition from China."
    - "China’s CXMT completed a RMB57.92 billion Shanghai IPO, while Reuters also reported progress in domestic immersion DUV lithography. These developments may increase future competition in memory chips and semiconductor equipment."
    - "The Japanese yen strengthened sharply, increasing concerns about yen carry-trade unwinding. I do not think this indicates a systemic crisis, but the risk of broader deleveraging remains worth monitoring."

- date: "2026-07-24"
  summary: "This week the market continued to weaken, with VOO and QQQ extending their declines. Although SMH posted a modest rebound, it remained well below its recent high, suggesting that the semiconductor sector has not yet established a sustained recovery."
  key_observation: "Despite a modest gain in SMH, the broader market has not shown convincing signs of recovery, as VOO and QQQ both continued to weaken."
  market_notes:
    - "VOO and QQQ both declined again this week, indicating continued weakness in the broader market and large-cap technology."
    - "Major companies released Q2 earnings this week. Tesla and IBM disappointed investors, while Alphabet delivered strong operating results. However, continued AI spending remained a key market concern and weighed on investor sentiment."
    - "SMH posted a modest weekly rebound, but it remained substantially below its 52-week high. At this stage, the rebound appears more like a pause within the broader decline than a confirmed recovery."
    - "Overall, I do not think the market has shown convincing signs of recovery yet. I will continue focusing on long-term trends rather than reacting to short-term market fluctuations."

- date: "2026-07-17"
  summary: "This week saw a significant market pullback, especially in the AI-related semiconductor sector represented by SMH. The overall tone of market commentary became noticeably more bearish, but I do not think the long-term outlook has changed."
  key_observation: "Short-term price movements can create a lot of noise, but they should always be interpreted together with macroeconomic data rather than market sentiment alone."
  market_notes:
    - "This week's drawdown widened across all three ETFs, with SMH deteriorating the most. Week-over-week returns also turned negative across all three ETFs, confirming the short-term weakness."
    - "Headline CPI inflation came in lower than expected (3.5% vs. 3.8% forecast), which I view as a positive sign for the long-term economy."
    - "Fed Chair Kevin Warsh emphasized the importance of obtaining a proper reading of economic conditions and reviewing the Fed's existing policy framework. He also maintained a hawkish stance on inflation and reaffirmed the Fed's commitment to restoring price stability."
    - "For now, I still believe the long-term economic outlook remains in good shape. I do not want short-term fluctuations and market noise to create unnecessary psychological pressure or influence my long-term investment decisions."

- date: "2026-07-10"
  summary: "This week was the first time I learned how to interpret drawdown and week-over-week return together. Before, I mostly focused on weekly returns. This week I realized that drawdown provides the long-term context that weekly performance alone cannot show."
  key_observation: "Weekly performance is more meaningful when viewed alongside each ETF's distance from its 52-week high."
  market_notes:
    - "VOO and QQQ have recovered most of their previous declines and remain close to their 52-week highs. The broader market appears to have regained most of its previous weakness."
    - "SMH posted the strongest weekly rebound, but it remains well below its previous high. The semiconductor sector is still in the recovery phase, and it is too early to tell whether this recovery will continue."
    - "Looking at these charts over time makes it much easier to identify trends. Instead of focusing on a single week's gain or loss, I can see whether each ETF is moving toward or away from its previous high."
